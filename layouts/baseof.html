<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
{{- block "main" . }}{{ end }}
<script>
(function () {
  var root = document.documentElement;
  root.classList.add("js");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
  var panels = Array.prototype.slice.call(document.querySelectorAll(".tab-content"));
  if (!tabs.length) return;
  function show(id) {
    var found = panels.some(function (p) { return p.id === id; });
    if (!found) id = panels[0].id;
    panels.forEach(function (p) { p.classList.toggle("active", p.id === id); });
    tabs.forEach(function (t) {
      var on = t.getAttribute("href") === "#" + id;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
    });
  }
  tabs.forEach(function (t) {
    t.addEventListener("click", function (e) {
      e.preventDefault();
      var id = t.getAttribute("href").slice(1);
      show(id);
      if (history.replaceState) history.replaceState(null, "", "#" + id);
    });
  });
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
